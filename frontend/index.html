<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connectra Telecom — Mobile, Fibre, VoIP & Business Voice</title>
    <meta name="description" content="Connectra Telecom, a VINK Group company: mobile contracts, home fibre, VoIP calling and business phone systems in South Africa. Prices in ZAR." />
    <meta name="theme-color" content="#0a1a3f" />
    <meta name="application-name" content="Connectra" />
    <meta name="vink-group-url" content="%VINK_GROUP_URL%" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Icons: Google Search shows the favicon (a multiple of 48px) next to results -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social sharing (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connectra Telecom" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Connectra Telecom — Stay Connected. Stay Ahead." />
    <meta property="og:description" content="Mobile contracts, home fibre, VoIP and business voice across South Africa. A division of VINK Group (Pty) Ltd." />
    <meta property="og:image" content="%SITE_URL%/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/assets/og-image.jpg" />

    <link rel="preload" as="image" type="image/webp" imagesrcset="/assets/connectra-hero-560.webp 560w, /assets/connectra-hero-1024.webp 1024w" imagesizes="(max-width: 760px) 340px, 465px" />

    <!-- Structured data: Google uses Organization.logo for the logo in search results and the knowledge panel -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%SITE_URL%/#organization",
          "name": "Connectra Telecom",
          "alternateName": "Connectra",
          "url": "%SITE_URL%/",
          "logo": { "@type": "ImageObject", "url": "%SITE_URL%/assets/connectra-logo.png", "width": 512, "height": 512 },
          "image": "%SITE_URL%/assets/og-image.jpg",
          "description": "Mobile contracts, home fibre, VoIP and business voice in South Africa.",
          "areaServed": "ZA",
          "currenciesAccepted": "ZAR",
          "parentOrganization": {
            "@type": "Organization",
            "name": "VINK Group (Pty) Ltd",
            "url": "%VINK_GROUP_URL%",
            "identifier": "2018/079316/07",
            "address": { "@type": "PostalAddress", "addressLocality": "Cape Town", "addressCountry": "ZA" }
          }
        },
        {
          "@type": "WebSite",
          "@id": "%SITE_URL%/#website",
          "name": "Connectra Telecom",
          "alternateName": "Connectra",
          "url": "%SITE_URL%/",
          "publisher": { "@id": "%SITE_URL%/#organization" },
          "inLanguage": "en-ZA"
        }
      ]
    }
    </script>
  </head>

    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>

</html>
